<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PORSCHE | Painel de Vendas — Black Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#0A0A0A;--card:#141414;--line:#2A2A2A;--red:#D5001C;--white:#fff;--muted:#888}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:var(--bg);color:var(--white)}
.hero{position:relative;height:420px;overflow:hidden;background:radial-gradient(60% 80% at 70% 20%,#1e1e1e,#0A0A0A 70%);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 6%}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0A0A0A 35%,transparent 70%)}
.hero-content{position:relative;z-index:2;max-width:520px}
.logo{letter-spacing:.45em;font-weight:200;font-size:13px;margin-bottom:24px;display:flex;gap:12px;align-items:center}
.logo b{font-weight:600;letter-spacing:.2em;background:var(--red);padding:2px 8px;font-size:10px}
.hero h1{font-weight:200;font-size:42px;line-height:.95;letter-spacing:-.02em}
.hero h1 span{font-weight:600}
.hero p{margin-top:16px;color:var(--muted);font-weight:300;line-height:1.6}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:0}
.kpi{background:var(--card);padding:22px 24px}
.kpi label{font-size:10px;letter-spacing:.3em;color:var(--muted);display:block;margin-bottom:8px}
.kpi strong{font-size:26px;font-weight:300}
.wrap{padding:32px 6%;display:grid;grid-template-columns:1.2fr .8fr;gap:24px}
.card{background:var(--card);border:1px solid var(--line);padding:24px}
.card h3{font-size:11px;letter-spacing:.3em;font-weight:400;margin-bottom:20px}
.filtros{display:flex;gap:10px;flex-wrap:wrap;padding:20px 6% 0 6%}
.filtros select{background:#1A1A1A;border:1px solid #2A2A2A;color:#fff;padding:10px 14px;font-size:12px;letter-spacing:.1em}
.table{width:100%;border-collapse:collapse;margin-top:12px}
.table th{font-size:10px;letter-spacing:.2em;color:var(--muted);text-align:left;padding:10px 0;border-bottom:1px solid var(--line);font-weight:400}
.table td{padding:12px 0;border-bottom:1px solid #1A1A1A;font-size:13px;font-weight:300}
.badge{border:1px solid var(--line);padding:2px 8px;font-size:10px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="hero">
<div class="hero-content">
<div class="logo">PORSCHE <b>BLACK EDITION</b></div>
<h1>Cayenne<br><span>Coupé</span></h1>
<p>Modelo mais vendido — 4 unidades — 4,0% de participação. Painel analítico premium inspirado no design system oficial da Porsche Brasil.</p>
</div>
</div>
<div class="kpis">
<div class="kpi"><label>TOTAL DE VENDAS</label><strong>100</strong></div>
<div class="kpi"><label>BILHETERIA</label><strong>US$ 128,278</strong></div>
<div class="kpi"><label>MODELO TOP</label><strong>Cayenne Coupé</strong></div>
<div class="kpi"><label>CIDADE TOP</label><strong>Atlanta</strong></div>
</div>
<div class="wrap">
<div class="card"><h3>PRINCIPAIS MODELOS POR CIDADE</h3><canvas id="c1"></canvas></div>
<div class="card"><h3>ANO MODELO MAIS VENDIDO — 2024 LIDERA 29%</h3><canvas id="c2"></canvas></div>
</div>
<script>
new Chart(document.getElementById('c1'),{type:'bar',data:{labels:['Atlanta','Miami','Orlando','Dallas','Austin'],datasets:[{data:[4,3,3,2,2],backgroundColor:'#D5001C'}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1A1A1A'}},y:{grid:{display:false}}}}});
new Chart(document.getElementById('c2'),{type:'doughnut',data:{labels:['2024','2023','2022','2025'],datasets:[{data:[29,25,22,24],backgroundColor:['#D5001C','#2A2A2A','#1A1A1A','#444']}]},options:{plugins:{legend:{labels:{color:'#888'}}},cutout:'68%'}});
</script>
</body>
</html>
